name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    # Installs from the registry on every run rather than restoring a cached
    # node_modules: with nmHoistingLimits: workspaces that cache is ~1 GB of
    # small files, which took 12-16 minutes to unpack on the macOS runners
    # (and 8-13 to pack whenever its key changed), against about a minute to
    # fetch every package.
    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
