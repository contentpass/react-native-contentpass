name: E2E Android

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  e2e-android:
    # GitHub already withholds secrets from fork-originated pull_request
    # runs, so this only decides whether the job shows as skipped (clean)
    # rather than failed on missing credentials for those runs.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: happy-path
            onetrust_app_id: ''
            gate_timeout_ms: ''
          - flow: onetrust-adapter-failure
            onetrust_app_id: 'e2e-invalid-app-id'
            gate_timeout_ms: ''
          - flow: cmp-timeout-fail-open
            onetrust_app_id: ''
            gate_timeout_ms: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('examples/onetrust/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prebuild Android project
        working-directory: examples/onetrust
        # android/ is gitignored (generated by expo prebuild), so a clean
        # checkout needs this before any Gradle task is available.
        run: npx expo prebuild --platform android --no-install

      - name: Build app (${{ matrix.flow }})
        working-directory: examples/onetrust/android
        env:
          EXPO_PUBLIC_ONETRUST_APP_ID: ${{ matrix.onetrust_app_id }}
          EXPO_PUBLIC_GATE_TIMEOUT_MS: ${{ matrix.gate_timeout_ms }}
        run: ./gradlew assembleDebug

      - name: Run ${{ matrix.flow }} on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          script: |
            adb install -r examples/onetrust/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test examples/onetrust/e2e/flows/${{ matrix.flow }}.yaml \
              -e E2E_STAGING_EMAIL="${{ secrets.E2E_STAGING_EMAIL }}" \
              -e E2E_STAGING_PASSWORD="${{ secrets.E2E_STAGING_PASSWORD }}"
