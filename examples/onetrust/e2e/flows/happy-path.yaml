appId: com.contentpassOnetrustExample.onetrustExample
---
# Full happy path against the real contentpass-staging backend and the real
# OneTrust test tenant: accept consent, then separately verify login/logout
# with a static staging test account (${E2E_STAGING_EMAIL} /
# ${E2E_STAGING_PASSWORD}, injected at `maestro test` invocation time — see
# e2e/README.md).
#
# The funnel shown here is real, hosted Contentpass content (not native
# OneTrust banner UI — this app never calls into OneTrust's own banner, only
# its consent-status/adapter APIs), so its labels are verified against a
# live run rather than guessed: "Einwilligen & weiter" (not "Accept All")
# and "Login mit Contentpass" (not "Log in").
- launchApp
- extendedWaitUntil:
    visible: 'Login mit Contentpass'
    timeout: 30000
- tapOn: 'Einwilligen & weiter'
- assertVisible:
    id: 'content-full-consent'
- assertVisible: 'Has full consent: Yes'

# Relaunch to a clean funnel, then verify the auth path independently of
# consent. iOS shows its own native ASWebAuthenticationSession permission
# dialog ("Wants to Use... to Sign In") before the real OIDC login page
# loads — there's no Android equivalent of this step.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Login mit Contentpass'
    timeout: 30000
- tapOn: 'Login mit Contentpass'
- tapOn: 'Continue'
- tapOn: 'Email'
- inputText: ${E2E_STAGING_EMAIL}
- hideKeyboard
- tapOn: 'PASSWORD'
- inputText: ${E2E_STAGING_PASSWORD}
- tapOn: 'Log in'

# Back in the app after the OAuth redirect.
- assertVisible:
    id: 'content-authenticated'
- assertVisible: 'Is authenticated: Yes'
- tapOn:
    id: 'content-logout-button'
- assertVisible: 'Is authenticated: No'
